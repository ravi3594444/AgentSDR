# Lead discovery for the owner's assistant: a self-hosted Google Maps
# scraper (https://github.com/gosom/google-maps-scraper, MIT) that the app
# asks for public business listings ("dental clinics in Pune"), then reads
# each business's own website for contact details.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml \
#     -f docker-compose.discovery.yml up -d --build
#
# (or COMPOSE_FILE=docker-compose.yml:docker-compose.build.yml:docker-compose.discovery.yml
# in .env, then plain `docker compose up -d --build`).
#
# Read before enabling: scraping Google Maps is against Google's Terms of
# Service, and Google may rate-limit or block the server's IP. It reads only
# businesses with a public listing. Without this file the assistant still
# works with uploaded contact lists and says lead search is not set up.
#
# The scraper runs a headless Chromium: budget about 1 GB of memory for it.

services:
  gmaps-scraper:
    image: gosom/google-maps-scraper:v1.18.1
    restart: unless-stopped
    command: ["-web", "-data-folder", "/gmapsdata"]
    volumes:
      - gmaps-data:/gmapsdata
    # No published port: only the app reaches it, on the compose network.
    mem_limit: 1536m

  app:
    environment:
      GMAPS_SCRAPER_URL: http://gmaps-scraper:8080
    depends_on:
      gmaps-scraper:
        condition: service_started

volumes:
  gmaps-data:
